<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    
    <!-- Load MathJax for LaTeX support -->
    <script id="mathjax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- _includes/mermaid.html -->
    <script type="module">
        import mermaid from '[https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs](https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs)';

        document.addEventListener('DOMContentLoaded', async () => {
            const blocks = document.querySelectorAll('pre > code.language-mermaid');
            blocks.forEach((block) => {
                const pre = block.parentElement;
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.textContent;
                pre.replaceWith(div);
            });

            mermaid.initialize({ startOnLoad: false, theme: 'default' });
            await mermaid.run({ querySelector: '.mermaid' });
        });
    </script>
</head>
<body>
    <main class="page-content" aria-label="Content">
        <!-- This injects your Markdown content into the webpage -->
        {{ content }}
    </main>
</body>
</html>
